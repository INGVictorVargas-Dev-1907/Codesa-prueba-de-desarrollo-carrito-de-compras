services:
  db:
    image: postgres:16-alpine
    container_name: codesa-db
    environment:
      POSTGRES_DB: codesa_shop
      POSTGRES_USER: codesa
      POSTGRES_PASSWORD: codesa123
    ports:
      - "5432:5432"
    volumes:
      - codesa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesa -d codesa_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codesa_pgdata: