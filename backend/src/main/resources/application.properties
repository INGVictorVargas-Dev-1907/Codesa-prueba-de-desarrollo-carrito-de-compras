# Servidor
server.port=8080

# Datasource PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/codesa_shop
spring.datasource.username=codesa
spring.datasource.password=codesa123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Init (nosotros sembramos con CommandLineRunner)
spring.sql.init.mode=never

# Logging
logging.level.com.codesa.shop=INFO
logging.level.org.hibernate.SQL=WARN